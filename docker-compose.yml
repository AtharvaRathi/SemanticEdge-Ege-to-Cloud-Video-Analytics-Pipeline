services:
  # ─────────────────────────────────────────────────────────────
  # Qdrant Vector Database
  # Real-time ANN similarity search for 768-dim SigLIP embeddings
  # ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semanticedge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC endpoint for high-throughput batching
    environment:
      - QDRANT__STORAGE__ASYNC_SCORER=true
      - QDRANT__STORAGE__MAX_SEARCH_THREADS=0
      - QDRANT__STORAGE__MMAP_THRESHOLD_KB=51200
      - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=64
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - semanticedge-net

  # ─────────────────────────────────────────────────────────────
  # Redis Queue & State Broker
  # Inter-tier buffering for high-velocity edge-to-cloud frames
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: semanticedge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - semanticedge-net

  # ─────────────────────────────────────────────────────────────
  # Cloud Search Engine & Ingestion API (FastAPI)
  # Receives filtered keyframes from edge and runs SigLIP searches
  # ─────────────────────────────────────────────────────────────
  cloud:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    image: semanticedge-cloud:latest
    container_name: semanticedge-cloud
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=video_embeddings
      - QDRANT_USE_SERVER=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    volumes:
      - model_cache:/root/.cache/huggingface
      - ./cloud/temp_uploads:/app/temp_uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - semanticedge-net

  # ─────────────────────────────────────────────────────────────
  # SemanticEdge Frontend (React + Nginx)
  # Minimalist visual zero-shot search interface
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: semanticedge-frontend:latest
    container_name: semanticedge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"     # Web UI available at http://localhost:3001 (configurable via FRONTEND_PORT)
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - cloud
    networks:
      - semanticedge-net

# ───────────────────────────────────────────────────────────────
# Networks & Persistent Volumes
# ───────────────────────────────────────────────────────────────
networks:
  semanticedge-net:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  model_cache:
    driver: local
